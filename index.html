    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calciverse - Calculators, Converters & Generators</title>
    <meta name="description" content="Free calculators, converters and generators for finance, education, health and everyday life in India." />
    <script>
      (function() {
        var theme = localStorage.getItem('calciverse_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
